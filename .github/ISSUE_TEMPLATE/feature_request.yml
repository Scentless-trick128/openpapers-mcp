name: Feature request
description: Suggest an idea for this project
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: "I want to ..., but OpenPapers currently can't ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would success look like?
      description: The smallest change that would unblock you. New tool? New field on an existing tool? Different default?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false
