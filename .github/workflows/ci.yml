name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # `--group dev` installs the [dependency-groups].dev tooling.
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy
        continue-on-error: true  # tighten over time; not a release blocker yet

      - name: Test (pytest)
        run: uv run pytest -v

  # Optional manual smoke test against the live APIs.
  # Triggered via `Actions → CI → Run workflow` on GitHub. Pings OpenAlex,
  # CrossRef, and Unpaywall once each, asserting the field contract still
  # holds. No secrets required — CONTACT_EMAIL is a non-sensitive variable.
  live-smoke:
    name: Live API smoke test (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run live smoke tests
        run: uv run pytest -m live -v
        env:
          # Non-secret: appears in upstream User-Agent / mailto headers and is
          # required by Unpaywall (rejects example.com domains with HTTP 422).
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          OPENPAPERS_LIVE: "1"
